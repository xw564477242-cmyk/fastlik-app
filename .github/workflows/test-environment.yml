name: Wallet Test Environment Gate
on:
  push:
    branches: [test, "feature/test-environment-*"]
  pull_request:
    branches: [test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build isolated Test Wallet
        env:
          VITE_FASTLINK_ENVIRONMENT: TEST
          VITE_FASTLINK_API_URL: /api
          VITE_FASTLINK_BUILD_SHA: ${{ github.sha }}
          VITE_PUBLIC_BASE: /
        run: npm run build
      - run: |
          grep -R -F 'TEST' dist
          ! grep -R -F 'exquisite-surprise-production-309d' dist
          ! grep -R -F 'fastlink-backend-dev-development-a' dist
      - run: npm run test:cloudflare
