name: Legacy Rollback - Deploy FastLink Wallet

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_LEGACY_ROLLBACK to publish the legacy Pages fallback
        required: true
        type: choice
        options:
          - DO_NOT_DEPLOY
          - DEPLOY_LEGACY_ROLLBACK

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: inputs.confirmation == 'DEPLOY_LEGACY_ROLLBACK'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_FASTLINK_API_URL: https://exquisite-surprise-production-309d.up.railway.app/api
      VITE_FASTLINK_ENVIRONMENT: PRODUCTION
      VITE_FASTLINK_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
