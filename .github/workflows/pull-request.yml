name: Wallet Pull Request Gate

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallet-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wallet-pr-gate:
    name: Wallet PR Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Head
        uses: actions/checkout@v4

      - name: Assert checked out Head SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependency Install
        run: npm ci

      - name: Lint and Type Check
        run: npx tsc --noEmit

      - name: Unit and Security Contract Test
        run: node scripts/verify-dev-wallet.mjs

      - name: Build Railway Root
        env:
          VITE_PUBLIC_BASE: /
          VITE_FASTLINK_API_URL: https://fastlink-backend-dev-development-a.up.railway.app/api
          VITE_FASTLINK_ENVIRONMENT: SANDBOX
          VITE_FASTLINK_BUILD_SHA: ${{ github.sha }}
        run: |
          npm run build
          test -f dist/runtime-config.js
          grep -F 'src="./runtime-config.js"' dist/index.html

      - name: Build Repository Subpath
        env:
          VITE_PUBLIC_BASE: /fastlik-app/
          VITE_FASTLINK_API_URL: https://fastlink-backend-dev-development-a.up.railway.app/api
          VITE_FASTLINK_ENVIRONMENT: SANDBOX
          VITE_FASTLINK_BUILD_SHA: ${{ github.sha }}
        run: |
          npm run build
          test -f dist/runtime-config.js
          grep -F 'src="./runtime-config.js"' dist/index.html

      - name: Secret Scan
        run: node scripts/verify-dev-wallet.mjs
