name: Wallet Pull Request Gate

on:
  push:
    branches:
      - feature/flp-env-002-runtime-config-path
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallet-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wallet-pr-gate:
    name: Wallet PR Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert checked out Head SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependency Install
        run: npm ci

      - name: Lint and Type Check
        run: npx tsc --noEmit

      - name: Repository Unit Tests
        run: npm test

      - name: Internal transfer Mock integration in SANDBOX
        run: npm run test:transfer:sandbox

      - name: Internal transfer Mock integration in TEST
        run: npm run test:transfer:test

      - name: FX quote mounted integration in SANDBOX
        run: npm run test:fx-quote:sandbox

      - name: FX quote mounted integration in TEST
        run: npm run test:fx-quote:test

      - name: KYC status mounted integration in SANDBOX
        run: npm run test:kyc-status:sandbox

      - name: KYC status mounted integration in TEST
        run: npm run test:kyc-status:test

      - name: Wallet transactions Mock integration in SANDBOX
        run: npm run test:wallet-transactions:sandbox

      - name: Wallet transactions Mock integration in TEST
        run: npm run test:wallet-transactions:test

      - name: Wallet operation filters and refresh integration in SANDBOX
        run: npm run test:wallet-operation-filters:sandbox

      - name: Wallet operation filters and refresh integration in TEST
        run: npm run test:wallet-operation-filters:test

      - name: Card transaction refresh integration in SANDBOX
        run: npm run test:card-transaction-refresh:sandbox

      - name: Card transaction refresh integration in TEST
        run: npm run test:card-transaction-refresh:test

      - name: Card transaction detail refresh integration in SANDBOX
        run: npm run test:card-transaction-detail-refresh:sandbox

      - name: Card transaction detail refresh integration in TEST
        run: npm run test:card-transaction-detail-refresh:test

      - name: Atomic Card detail refresh integration in SANDBOX
        run: npm run test:card-detail-refresh:sandbox

      - name: Atomic Card detail refresh integration in TEST
        run: npm run test:card-detail-refresh:test

      - name: Card lifecycle timeline integration in SANDBOX
        run: npm run test:card-timeline:sandbox

      - name: Card lifecycle timeline integration in TEST
        run: npm run test:card-timeline:test

      - name: Unit and Security Contract Test
        run: node scripts/verify-dev-wallet.mjs

      - name: Build Railway Root
        env:
          VITE_PUBLIC_BASE: /
          VITE_FASTLINK_API_URL: /api
          VITE_FASTLINK_ENVIRONMENT: SANDBOX
          VITE_FASTLINK_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run build
          test -f dist/runtime-config.js
          grep -F 'src="./runtime-config.js"' dist/index.html

      - name: Build Repository Subpath
        env:
          VITE_PUBLIC_BASE: /fastlik-app/
          VITE_FASTLINK_API_URL: /api
          VITE_FASTLINK_ENVIRONMENT: SANDBOX
          VITE_FASTLINK_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run build
          test -f dist/runtime-config.js
          grep -F 'src="./runtime-config.js"' dist/index.html

      - name: Container Runtime Contract
        shell: bash
        env:
          IMAGE: fastlink-wallet-dev:${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg VITE_FASTLINK_API_URL=/api \
            --build-arg VITE_FASTLINK_ENVIRONMENT=SANDBOX \
            --build-arg VITE_PUBLIC_BASE=/ \
            --build-arg RAILWAY_GIT_COMMIT_SHA="$RELEASE_SHA" \
            --tag "$IMAGE" .
          docker run --detach --rm --name fastlink-wallet-dev-gate \
            --publish 127.0.0.1:18081:8080 \
            --env VITE_FASTLINK_API_URL=/api \
            --env VITE_FASTLINK_ENVIRONMENT=SANDBOX \
            --env RAILWAY_GIT_COMMIT_SHA="$RELEASE_SHA" \
            "$IMAGE"
          trap 'docker stop fastlink-wallet-dev-gate >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            curl --fail --silent http://127.0.0.1:18081/healthz && break
            sleep 1
          done
          runtime="$(curl --fail --silent http://127.0.0.1:18081/runtime-config.js)"
          grep -F 'environment: "SANDBOX"' <<<"$runtime"
          grep -F 'apiUrl: "/api"' <<<"$runtime"
          grep -F "buildSha: \"$RELEASE_SHA\"" <<<"$runtime"
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=5000 --dump-dom http://127.0.0.1:18081/ \
            > wallet-browser-smoke.html
          grep -F 'FastLink Wallet' wallet-browser-smoke.html
          grep -F 'Environment: <b>SANDBOX</b>' wallet-browser-smoke.html
          grep -F 'API: <code>/api</code>' wallet-browser-smoke.html
          grep -F 'Sign in to FastLink' wallet-browser-smoke.html

      - name: Secret Scan
        run: node scripts/verify-dev-wallet.mjs

      - name: Record immutable non-production evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          printf '{"format":"fastlink-wallet-pr-evidence-v11","sourceCommit":"%s","environment":"NON_PRODUCTION","productionEnabled":false,"validatedEnvironments":["SANDBOX","TEST"],"sessionLifecycleSource":"src/sessionLifecycle.ts","sessionLifecycleTests":["tests/sessionLifecycle.test.ts"],"transferSource":"src/walletTransfer.ts","walletTransactionSource":"src/walletTransactions.ts","walletTransactionTests":["tests/walletTransactions.test.ts","tests/walletTransactions.integration.test.ts"],"walletOperationSources":["src/App.tsx","src/apiClient.ts","src/walletOperations.ts"],"walletOperationTests":["tests/walletOperations.test.ts","tests/walletOperationFilters.integration.test.ts"],"walletOperationPolicy":{"methods":["GET"],"automaticRetry":false,"filters":["type","status"],"pageSize":25,"cursorContract":"backend-v2-exact","cursorBindings":["type","status","createdAt","id"],"cursorHistory":true,"paginationOrder":["createdAt:desc","id:desc"]},"cardTransactionRefreshSources":["src/App.tsx","src/cardTransactionDetail.ts","src/cardTransactionRefresh.ts"],"cardTransactionRefreshTests":["tests/cardTransactionDetail.test.ts","tests/cardTransactionRefresh.test.ts","tests/cardTransactionRefresh.integration.test.ts"],"cardTransactionDetailRefreshSources":["src/App.tsx","src/apiClient.ts","src/cardTransactionDetailRefresh.ts"],"cardTransactionDetailRefreshTests":["tests/cardTransactionDetailRefresh.test.ts","tests/cardTransactionDetailRefresh.integration.test.ts"],"fxQuoteSources":["src/FxQuotePreview.tsx","src/apiClient.ts","src/fxQuote.ts"],"fxQuoteTests":["tests/fxQuote.test.ts","tests/fxQuote.integration.test.ts","tests/fxQuote.mounted.integration.test.ts"],"fxQuotePolicy":{"method":"POST","automaticRetry":false,"callerCancellation":true,"sessionInvalidation":"current-explicit-401-only","runtimeApi":"/api"},"cardTimelineSources":["src/App.tsx","src/apiClient.ts","src/cardDetailRefresh.ts","src/cardTimeline.ts","src/cardTimelineRefresh.ts"],"cardTimelineTests":["tests/cardDetailRefresh.test.ts","tests/cardDetailRefresh.integration.test.ts","tests/cardTimeline.test.ts","tests/cardTimelineRefresh.test.ts","tests/cardTimeline.integration.test.ts"],"cardTimelinePolicy":{"methods":["GET"],"authentication":"HTTP_ONLY_COOKIE","session401Invalidation":"CURRENT_REQUEST_GENERATION_ONLY","snapshotClearStatuses":[401,403,404],"automaticRetry":false,"pageSize":25,"maxPages":10,"maxEvents":250,"publicFields":["id","type","fromStatus","toStatus","occurredAt"],"scopeBindings":["actorId","tenantId","customerId","environment","cardId","sessionExpiry","requestGeneration"]},"kycStatusSources":["src/KycStatusPanel.tsx","src/kycStatus.ts"],"kycStatusTests":["tests/kycStatus.test.ts","tests/kycStatus.mounted.integration.test.ts"],"kycStatusPolicy":{"method":"GET","runtimePath":"/api/v1/kyc/status","sameOrigin":true,"authentication":"HTTP_ONLY_COOKIE","automaticRetry":false,"validatedEnvironments":["SANDBOX","TEST"],"currentExplicit401":"clear-snapshot-and-invalidate-session","snapshotClearStatuses":[401,403,404],"transientSnapshotRetention":[0,408,500,502,503,504],"scopeBindings":["actorId","tenantId","customerId","environment","sessionExpiry","requestGeneration","sessionGeneration"],"staleCompletionWrites":0},"browserSmoke":"wallet-browser-smoke.html"}\n' "$SOURCE_SHA" > build-evidence.json
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const evidence = JSON.parse(readFileSync("build-evidence.json", "utf8"));
          evidence.format = "fastlink-wallet-pr-evidence-v12";
          evidence.consumerTransferSources = ["src/App.tsx", "src/apiClient.ts", "src/ConsumerTransferFlow.tsx", "src/consumerTransferState.ts", "src/walletTransfer.ts"];
          evidence.consumerTransferTests = ["tests/consumerTransferFlow.test.ts", "tests/consumerTransferFlow.integration.test.ts", "tests/walletTransfer.test.ts", "tests/walletTransfer.integration.test.ts"];
          evidence.consumerTransferPolicy = {runtimeApi:"/api",submitPath:"/v1/wallet/transfers",statusPath:"/v1/wallet/operations/{id}",submitMethod:"POST",statusMethod:"GET",authentication:"HTTP_ONLY_COOKIE_CSRF",validatedEnvironments:["SANDBOX","TEST"],automaticRetry:false,ambiguousRetryStatuses:[0,408,"5xx"],idempotency:"same-key-exact-scope-and-input",responseBounds:{accounts:65536,receipt:16384},scopeBindings:["actorId","tenantId","customerId","environment","sessionExpiry","sourceAccountVersion","destinationAccountId","amount","requestGeneration","inputGeneration"],sessionInvalidation:"current-explicit-401-only",staleCompletionWrites:0,productionEnabled:false};
          writeFileSync("build-evidence.json", `${JSON.stringify(evidence)}\n`);
          EOF
          sha256sum .gitignore .github/workflows/pull-request.yml package.json scripts/verify-dev-wallet.mjs scripts/verify-cloudflare.mjs dist/index.html dist/runtime-config.js wallet-browser-smoke.html package-lock.json build-evidence.json src/sessionLifecycle.ts tests/sessionLifecycle.test.ts src/walletTransfer.ts tests/walletTransfer.test.ts tests/walletTransfer.integration.test.ts src/walletTransactions.ts tests/walletTransactions.test.ts tests/walletTransactions.integration.test.ts src/walletOperations.ts tests/walletOperations.test.ts tests/walletOperationFilters.integration.test.ts src/App.tsx src/apiClient.ts src/cardDetailRefresh.ts src/cardTimeline.ts src/cardTimelineRefresh.ts src/cardTransactionDetail.ts src/cardTransactionRefresh.ts src/cardTransactionDetailRefresh.ts tests/cardDetailRefresh.test.ts tests/cardDetailRefresh.integration.test.ts tests/cardTimeline.test.ts tests/cardTimelineRefresh.test.ts tests/cardTimeline.integration.test.ts tests/cardTransactionDetail.test.ts tests/cardTransactionRefresh.test.ts tests/cardTransactionRefresh.integration.test.ts tests/cardTransactionDetailRefresh.test.ts tests/cardTransactionDetailRefresh.integration.test.ts src/FxQuotePreview.tsx src/fxQuote.ts tests/fxQuote.test.ts tests/fxQuote.integration.test.ts tests/fxQuote.mounted.integration.test.ts src/KycStatusPanel.tsx src/kycStatus.ts tests/kycStatus.test.ts tests/kycStatus.mounted.integration.test.ts > build-provenance.sha256
          sha256sum src/ConsumerTransferFlow.tsx src/consumerTransferState.ts tests/consumerTransferFlow.test.ts tests/consumerTransferFlow.integration.test.ts >> build-provenance.sha256
          sha256sum --check build-provenance.sha256

      - name: Upload non-production build evidence
        uses: actions/upload-artifact@v4
        with:
          name: fastlink-wallet-pr-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/
            .gitignore
            .github/workflows/pull-request.yml
            package.json
            package-lock.json
            scripts/verify-dev-wallet.mjs
            scripts/verify-cloudflare.mjs
            build-evidence.json
            build-provenance.sha256
            wallet-browser-smoke.html
            src/sessionLifecycle.ts
            tests/sessionLifecycle.test.ts
            src/walletTransfer.ts
            tests/walletTransfer.test.ts
            tests/walletTransfer.integration.test.ts
            src/walletTransactions.ts
            tests/walletTransactions.test.ts
            tests/walletTransactions.integration.test.ts
            src/walletOperations.ts
            tests/walletOperations.test.ts
            tests/walletOperationFilters.integration.test.ts
            src/App.tsx
            src/apiClient.ts
            src/cardDetailRefresh.ts
            src/cardTimeline.ts
            src/cardTimelineRefresh.ts
            src/cardTransactionDetail.ts
            src/cardTransactionRefresh.ts
            src/cardTransactionDetailRefresh.ts
            tests/cardTransactionDetail.test.ts
            tests/cardTransactionRefresh.test.ts
            tests/cardTransactionRefresh.integration.test.ts
            tests/cardTransactionDetailRefresh.test.ts
            tests/cardTransactionDetailRefresh.integration.test.ts
            src/FxQuotePreview.tsx
            src/fxQuote.ts
            tests/fxQuote.test.ts
            tests/fxQuote.integration.test.ts
            tests/fxQuote.mounted.integration.test.ts
            tests/cardDetailRefresh.test.ts
            tests/cardDetailRefresh.integration.test.ts
            tests/cardTimeline.test.ts
            tests/cardTimelineRefresh.test.ts
            tests/cardTimeline.integration.test.ts
            src/KycStatusPanel.tsx
            src/kycStatus.ts
            tests/kycStatus.test.ts
            tests/kycStatus.mounted.integration.test.ts
            src/ConsumerTransferFlow.tsx
            src/consumerTransferState.ts
            tests/consumerTransferFlow.test.ts
            tests/consumerTransferFlow.integration.test.ts
          if-no-files-found: error
          retention-days: 7
